<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>CoupleBudget</title><link rel=manifest href=manifest.webmanifest><link rel=stylesheet href=style.css></head><body><header><h1>CoupleBudget</h1><p>Shared household budget, without the complexity.</p></header><main><section class=cards><article><span>Income</span><b id=income>€0</b></article><article><span>Spent</span><b id=spent>€0</b></article><article><span>Left</span><b id=left>€0</b></article></section><section class=panel><h2>Add transaction</h2><form id=form><input name=date type=date required><select name=type><option value=expense>Expense</option><option value=income>Income</option></select><input name=amount type=number step=.01 min=.01 placeholder="Amount" required><input name=category placeholder="Category" required><input name=member placeholder="Member" value="Household"><input name=note placeholder="Note"><button>Add</button></form></section><section class=panel><div class=row><h2>Monthly category budgets</h2><button id=addBudget>Add budget</button></div><div id=budgets></div></section><section class=panel><div class=row><h2>Transactions</h2><input id=search placeholder="Search…"></div><div id=tx></div></section><section class=panel><h2>Backup</h2><button id=exportJson>Export JSON</button> <button id=exportCsv>Export CSV</button> <label class=button>Import JSON<input id=importJson type=file accept=.json hidden></label></section></main><script src=app.js></script></body></html>
